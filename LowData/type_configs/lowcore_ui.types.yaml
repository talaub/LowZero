module: LowCore
namespace:
  - Low
  - Core
  - UI
dll_macro: LOW_CORE_API
prefix: LowCoreUi
types:
  Controller:
    no_auto_serialize: true
    no_auto_deserialize: true
    no_auto_duplicate: true
    private_make: true
    properties:
      value:
        type: ControllerValue
      type:
        type: ControllerType
        private_setter: true
        no_ref: true
    functions:
      make_code:
        static: true
        return_type: Low::Core::UI::Controller
        return_handle: true
        parameters:
          - name: name
            type: Low::Util::Name
      make_script:
        static: true
        return_type: Low::Core::UI::Controller
        return_handle: true
        parameters:
          - name: name
            type: Low::Util::Name
          - name: class
            type: Low::Core::Scripting::Class
            handle: true
      spawn_instance:
        return_type: Low::Core::UI::ControllerInstance
        return_handle: true
      find_by_scriptclass:
        static: true
        return_type: Low::Core::UI::Controller
        return_handle: true
        parameters:
          - name: scriptClass
            type: Low::Core::Scripting::Class
            handle: true
      is_script_controller:
        return_type: bool
        constant: true
        const: true
      update_instances:
        return_type: void
      fill_binding_options:
        return_type: void
        parameters:
          - name: options
            type: Low::Util::List<BindingOption>
  ControllerInstance:
    no_auto_serialize: true
    no_auto_deserialize: true
    no_auto_duplicate: true
    properties:
      value:
        type: ControllerInstanceValue
      controller:
        type: uint64_t
    functions:
      handle_click:
        return_type: void
        parameters:
          - name: element
            type: Low::Core::UI::Element
            handle: true
  WidgetAsset:
    no_auto_serialize: true
    no_auto_deserialize: true
    no_auto_duplicate: true
    name_editable: true
    scripting_expose: true
    unique_id: true
    properties:
      state:
        type: Low::Core::UI::LoadState
        no_ref: true
      content:
        type: Low::Util::List<Low::Core::UI::ElementDescriptor>
        expose_scripting: false
      path:
        type: Low::Util::String
        private_setter: true
      data_path:
        type: Low::Util::String
        private_setter: true
      controller:
        type: Low::Core::UI::Controller
        handle: true
        editor_editable: true
      has_custom_controller:
        type: bool
        setter_name: has_custom_controller
        getter_name: has_custom_controller
      local_element_id_counter:
        private_setter: true
        private_getter: true
        type: uint64_t
      custom_controller_id:
        type: uint64_t
      bindings:
        type: Low::Util::List<BindingDescription>
    functions:
      get_next_local_id:
        return_type: uint64_t
      serialize_content:
        private: true
        return_type: void
        parameters:
          - name: node
            type: Low::Util::Serial::Node
      parse_content:
        private: true
        return_type: void
        parameters:
          - name: node
            type: Low::Util::Serial::Node
      parse_element:
        private: true
        return_type: void
        parameters:
          - name: node
            type: Low::Util::Serial::Node
          - name: descriptor
            type: Low::Core::UI::ElementDescriptor
      spawn_instance:
        return_type: WidgetInstance
        return_handle: true
        parameters:
          - name: canvas
            type: Low::Renderer::UiCanvas
            handle: true
      spawn_element:
        return_type: Low::Core::UI::Element
        return_handle: true
        parameters:
          - name: instance
            type: Low::Core::UI::WidgetInstance
            handle: true
          - name: canvas
            type: Low::Renderer::UiCanvas
            handle: true
          - name: descriptor
            type: Low::Core::UI::ElementDescriptor
          - name: parent
            type: Low::Core::UI::Element
            handle: true
      spawn_from_element_descriptor:
        private: true
        return_type: Low::Core::UI::Element
        return_handle: true
        parameters:
          - name: instance
            type: Low::Core::UI::WidgetInstance
            handle: true
          - name: canvas
            type: Low::Renderer::UiCanvas
            handle: true
          - name: descriptor
            type: Low::Core::UI::ElementDescriptor
          - name: parent
            type: Low::Core::UI::Element
            handle: true
      fill_element_descriptor:
        return_type: bool
        private: true
        parameters:
          - name: element
            type: Low::Core::UI::Element
            handle: true
          - name: descriptor
            type: Low::Core::UI::ElementDescriptor
          - name: instance
            type: Low::Core::UI::WidgetInstance
            handle: true
      fill_content_from_instance:
        return_type: void
        parameters:
          - name: instance
            type: Low::Core::UI::WidgetInstance
            handle: true
      serialize_element_descriptor:
        return_type: void
        private: true
        constant: true
        parameters:
          - name: descriptor
            type: Low::Core::UI::ElementDescriptor
            const: true
          - name: node
            type: Low::Util::Serial::Node
      create_binding:
        return_type: void
        parameters:
          - name: controllerBindingOption
            type: Util::Name
          - name: bindHandle
            type: Util::Handle
            no_ref: true
          - name: bindPropertyName
            type: Util::Name
      clear_bindings:
        return_type: void
        parameters:
          - name: bindLocalId
            type: uint64_t
          - name: bindPropertyName
            type: Util::Name

  WidgetInstance:
    no_auto_serialize: true
    no_auto_deserialize: true
    no_auto_duplicate: true
    scripting_expose: true
    properties:
      root:
        type: Low::Core::UI::Element
        handle: true
      elements:
        type: Low::Util::List<Low::Core::UI::Element>
        no_setter: true
      element_map:
        type: Low::Util::Map<uint64_t, Low::Core::UI::Element>
      widgets:
        type: Low::Util::List<Low::Core::UI::WidgetInstance>
        no_setter: true
      controller_instance:
        type: Low::Core::UI::ControllerInstance
        handle: true
      asset:
        type: uint64_t
    functions:
      find_element_by_local_id:
        return_type: Low::Core::UI::Element
        return_handle: true
        parameters:
          - name: localId
            type: uint64_t
            const: true
      evaluate_bindings:
        return_type: void

  Screen:
    unique_id: true
    name_editable: true
    no_auto_duplicate: true
    scripting_expose: true
    header_imports:
      - LowMath.h
    source_imports:
      - LowCoreUiElement.h
      - LowCoreUiDisplay.h
      - LowUtilFileIO.h
      - LowRendererUiCanvas.h
    properties:
      elements:
        type: Util::List<Core::UI::Element>
        no_setter: true
        skip_serialization: true
        skip_deserialization: true
      pixel_position:
        type: Low::Math::Vector2
        editor_editable: true
        expose_scripting: true
        getter_name: pixel_position
        setter_name: pixel_position
        dirty_flag: dirty
      pixel_size:
        type: Low::Math::Vector2
        editor_editable: true
        expose_scripting: true
        getter_name: pixel_size
        setter_name: pixel_size
        dirty_flag: dirty
      zoom:
        type: float
        editor_editable: true
        expose_scripting: true
        getter_name: zoom
        setter_name: zoom
        dirty_flag: dirty
      canvas:
        type: Low::Renderer::UiCanvas
        handle: true
        editor_editable: true
    functions:
      make_from_widget_asset:
        return_type: Low::Core::UI::Screen
        return_handle: true
        static: true
        parameters:
          - name: name
            type: Low::Util::Name
          - name: widgetAsset
            type: Low::Core::UI::WidgetAsset
            handle: true
      add_element:
        return_type: void
        parameters:
          - name: element
            type: Low::Core::UI::Element
            handle: true

  Element:
    no_auto_serialize: true
    no_auto_deserialize: true
    no_auto_duplicate: true
    name_editable: true
    scripting_expose: true
    unique_id: true
    private_make: true
    scripting_namespace: UI
    header_imports:
      - LowCoreUiScreen.h
      - LowRendererUiCanvas.h
    source_imports:
      - LowCoreUiDisplay.h
    properties:
      components:
        type: Util::Map<uint16_t, Util::Handle>
        no_setter: true
      cached_screen:
        type: Low::Core::UI::Screen
        handle: true
        private_setter: true
      click_passthrough:
        type: bool
        expose_scripting: true
      canvas:
        type: Low::Renderer::UiCanvas
        handle: true
        private_setter: true
        skip_serialization: true
        skip_deserialization: true
      widget_instance:
        type: uint64_t
      local_id:
        type: uint64_t
        expose_scripting: true
    functions:
      make:
        static: true
        return_type: Element
        return_handle: true
        parameters:
          - name: name
            type: Low::Util::Name
          - name: canvas
            type: Low::Renderer::UiCanvas
            handle: true
      get_component:
        expose_scripting: true
        return_type: uint64_t
        constant: true
        parameters:
          - name: typeId
            type: uint16_t
      destroy_with_hierarchy:
        return_type: void
      add_component:
        expose_scripting: true
        return_type: void
        parameters:
          - name: component
            type: Low::Util::Handle
      remove_component:
        expose_scripting: true
        return_type: void
        parameters:
          - name: componentType
            type: uint16_t
      has_component:
        expose_scripting: true
        return_type: bool
        parameters:
          - name: componentType
            type: uint16_t
      get_display:
        expose_scripting: true
        return_type: Low::Core::UI::Component::Display
        return_handle: true
        constant: true
      serialize:
        return_type: void
        constant: true
        parameters:
          - name: node
            type: Util::Serial::Node
          - name: addHandles
            type: bool
      serialize_hierarchy:
        return_type: void
        constant: true
        parameters:
          - name: node
            type: Util::Serial::Node
          - name: addHandles
            type: bool
      deserialize_hierarchy:
        return_type: UI::Element
        return_handle: true
        static: true
        parameters:
          - name: node
            type: Util::Serial::Node
          - name: creator
            type: Util::Handle
            handle: true
      update_screen:
        return_type: void
        parameters:
          - name: screen
            type: Low::Core::UI::Screen
            handle: true
